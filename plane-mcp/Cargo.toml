# busbar-plane-mcp: the MCP plane. Its door (`busbar_plane_mcp::door`, in `plane_door`) over the
# Model Context Protocol's JSON-RPC dialect, which lives here; the cdylib twin
# `busbar-plane-mcp-plugin` exports the same door.
[package]
name = "busbar-plane-mcp"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The MCP plane for busbar: the plugin contract's plane kind over the Model Context Protocol's JSON-RPC dialect, revisions 2024-11-05 through 2026-07-28."
# THE ROOT CELLS' ADDRESS: `build.rs` states `cells=<this crate>/tests/root/mod.rs` under this
# `links` name, and the composition root's `build.rs` reads it as `DEP_BUSBAR_DOOR_CELLS_<CRATE>_CELLS`
# (the same for a path dependency and a pinned one), so the root compiles this plane's own root cells
# without naming this crate or resolving its checkout. Links no native library.
links = "busbar-door-cells-busbar-plane-mcp"

[lints]
workspace = true

[lib]
name = "busbar_plane_mcp"
path = "src/lib.rs"

# NO FEATURES, ON PURPOSE. A plane compiled two ways is two planes, and the kernel would have no way
# to tell which one it registered. The contract crate holds itself to the same rule and asserts it.

[dependencies]
# THE CONTRACT. The one busbar crate a plugin manifest may name without argument.
busbar-contract = { workspace = true }
# The `Mcp-Name` header's `=?base64?…?=` sentinel for a name a header value cannot carry
# (owner PLUGIN LIBRARIES ruling, 2026-09-28).
base64 = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
# The object notation the codec speaks. The adapter hands values across the seam and never invents
# a second parser.
serde_json = { workspace = true }
# The WHATWG host parser (`url::Host::parse`) the argument guard reads a host with: percent-decode,
# UTS #46 mapping (`ｌｏｃａｌｈｏｓｔ` is `localhost`) and the IPv4 number reading (`0x` is `0.0.0.0`),
# the reading a fetching upstream dials. Pure parsing; busbar's own row, already in its lock.
url = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { workspace = true, features = ["test-seal"] }
# The test kit, test-only: the counting allocator the allocation gates read (`src/tests/mod.rs`).
busbar-test-kit = { workspace = true }
