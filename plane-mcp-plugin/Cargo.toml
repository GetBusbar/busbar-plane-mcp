# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-plane-mcp-plugin"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party signed kind:plane plugin cdylib: the mcp plane, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."

[lints]
workspace = true

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door` is the door this image exports. A busbar build that
# LINKS the plane names the logic crate, which exports no symbol.
busbar-plane-mcp = { path = "../plane-mcp" }
busbar-contract = { workspace = true }

[dev-dependencies]
# The conformance tests load the linked door and dlopen the built cdylib over busbar's REAL loader:
# dev-only, never in the shipped artifact. `conformance` is busbar's published suite
# (`tests/conformance.rs`, `conformance_suite!`); `tests/both_ways.rs` is the door witness that
# moved here with the crate from busbar's crates/busbar-plane-mcp (its `tests/conformance.rs`).
busbar-plugin-loader = { workspace = true }
busbar-test-kit = { workspace = true }
# The door witness reads the plane's answers as JSON documents.
serde_json = { workspace = true }
# Manual ABI fixtures use the contract test support; the door witness binds its clock through
# the shared host-service double in busbar-test-kit, dev-only.
busbar-contract = { workspace = true, features = ["test-support"] }
# THE SUITE'S HOST CONNECTOR (`tests/support/conformance_host.rs`, `conformance_host!`, mounted by
# `tests/conformance.rs`): the transport doors this plugin's needs name, which the test kit's host
# loads and opens as the root does: `tcp` and `http` at the revs the workspace pins, and `stdio`
# (the process carrier of the `transport: stdio` need) at the rev busbar's dist links at the pin.
busbar-transport-http = { workspace = true }
busbar-transport-tcp = { workspace = true }
busbar-transport-stdio = { git = "https://github.com/GetBusbar/busbar-transport-stdio", rev = "79beea2100f04a38e13008539e7f2e4ad2a94073" }
