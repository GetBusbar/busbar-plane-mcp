# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-plane-mcp-plugin"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party signed kind:plane plugin cdylib: the mcp plane, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."

[lints]
workspace = true

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door` is the door this image exports. A busbar build that
# LINKS the plane names the logic crate, which exports no symbol.
busbar-plane-mcp = { path = "../plane-mcp" }
busbar-contract = { workspace = true }

[dev-dependencies]
# Ordinary tests use the actual loader for linked and freshly built dropped MCP doors.
busbar-plugin-loader = { workspace = true }
# The door witness reads the plane's answers as JSON documents.
serde_json = { workspace = true }
# Actual carrier doors composed by the ordinary MCP TLS/process host.
busbar-transport-http = { workspace = true }
busbar-transport-tcp = { workspace = true }
busbar-transport-stdio = { git = "https://github.com/GetBusbar/busbar-transport-stdio", rev = "c5cf7c2035791afbd1f012a6fd168a22193e6a7a" }

# Actual production connector/TLS for MCP's local catalogue; no shared test host.
busbar-core-connector = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }
rcgen = { workspace = true, features = ["pem"] }
rustls = { workspace = true }

busbar-store-memory = { workspace = true }
base64 = { workspace = true }

# Same source dependencies for ordinary actual-private-code integration tests.
serde = { workspace = true }
indexmap = { workspace = true }
jsonschema = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
