# RENDERED by `busbar-release plugin heal busbar-plane-mcp` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

# Nothing by default: each job below is granted exactly what the workflow it calls needs, and is
# passed only the secrets that workflow declares (never every secret wholesale).
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # No secrets: the tagged commit's CI needs none (coverage upload skips without CODECOV_TOKEN).
  release:
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@c0989f28494479c966fefda2f90a83ecbc6c9a1a
    with:
      plugin_crate: busbar-plane-mcp-plugin
      manifest_name: busbar-plane-mcp
      plugin_alias: mcp
      plugin_kind: plane
      asset_prefix: busbar-plane-mcp
      description: "First-party signed kind:plane plugin cdylib: the mcp plane, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "plane-mcp/declares.json"
    secrets:
      BUSBAR_SIGN_KEY: ${{ secrets.BUSBAR_SIGN_KEY }}
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@c0989f28494479c966fefda2f90a83ecbc6c9a1a
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-plane-mcp
      plugin_name: busbar-plane-mcp
      plugin_alias: mcp
      plugin_kind: plane
      bundle_image: ""
      bundle_env: ""
